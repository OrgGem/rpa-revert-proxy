# ==============================================================================
# openmanager-router.cfg — Internal Zero-Nginx Router for HAProxy OpenManager
# Replaces upstream `haproxy-openmanager-nginx` with HAProxy 3.0 Alpine
# ==============================================================================

global
    log stdout format raw local0 info
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout tunnel  3600s

frontend fe_openmanager_internal
    bind *:8080
    http-request return status 200 content-type text/plain lf-string "ok\n" if { path /health }

    acl is_backend_api path_beg /api/ /.well-known/acme-challenge/
    use_backend be_om_backend if is_backend_api
    default_backend be_om_frontend

backend be_om_backend
    option forwardfor
    server om_api openmanager-backend:8000 check inter 15s

backend be_om_frontend
    option forwardfor
    server om_ui openmanager-frontend:3000 check inter 15s
