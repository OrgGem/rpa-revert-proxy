# ==============================================================================
# Kernel Hardening & Zero-IP-Forward Rules for IPv4 & IPv6 (FR-01, FR-03A)
# Installed to: /etc/sysctl.d/99-haproxy-zero-fwd.conf
# ==============================================================================

# Strictly disable IPv4 & IPv6 packet forwarding across interfaces
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.default.forwarding = 0

# Loose Reverse Path Filtering (2) allows local packets arriving from Docker
# custom bridges (br-*) destined for dummy0 (10.254.254.1) to be accepted on INPUT
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
